<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reserve.me - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="login-container">
        <h1>reserve me</h1>
        
        <form id="loginForm" novalidate>
            <div class="input-group" id="nameGroup" hidden>
                <label for="name">Nome</label>
                <span id="nameError" class="error-message">Informe seu nome.</span>
                <input type="text" id="name" name="name" placeholder="Seu nome" autocomplete="name" maxlength="160" aria-describedby="nameError">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <span id="emailError" class="error-message">Informe um e-mail válido.</span>
                <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" aria-describedby="emailError" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <span id="passwordError" class="error-message">Informe sua senha.</span>
                <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" maxlength="128" aria-describedby="passwordError" required>
            </div>

            <div class="input-group" id="confirmPasswordGroup" hidden>
                <label for="confirmPassword">Confirme sua senha</label>
                <span id="confirmPasswordError" class="error-message">As senhas devem ser iguais.</span>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Digite a senha novamente" autocomplete="new-password" maxlength="128" aria-describedby="confirmPasswordError">
            </div>

            <p id="loginValidationMessage" class="form-error" role="alert" aria-live="assertive"></p>
            <button type="submit" id="submitBtn">Entrar</button>
            <p class="mode-switch">
                <span id="modePrompt">Ainda não tem uma conta?</span>
                <button type="button" id="toggleModeBtn" class="mode-toggle" aria-controls="nameGroup confirmPasswordGroup" aria-expanded="false">Criar conta</button>
            </p>
            <a href="recuperar-senha.html" class="recovery-link" id="recoveryLink">Esqueceu sua senha?</a>
        </form>
    </main>

    <footer class="footer">
        <a href="termos-privacidade.html#termos">Termos de uso</a>
        <span>·</span>
        <a href="termos-privacidade.html#privacidade">Privacidade</a>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
